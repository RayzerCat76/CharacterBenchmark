<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <style>
      .eyebrow { font: 700 21px Arial, Helvetica, sans-serif; letter-spacing: 4px; }
      .title { font: 700 50px Arial, Helvetica, sans-serif; fill: #f1f5fb; }
      .subtitle { font: 26px Arial, Helvetica, sans-serif; fill: #b9c8da; }
      .number { font: 700 22px Arial, Helvetica, sans-serif; fill: #081522; }
      .date { font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; }
      .cardtitle { font: 700 29px Arial, Helvetica, sans-serif; fill: #f1f5fb; }
      .body { font: 23px Arial, Helvetica, sans-serif; fill: #d2dce8; }
      .evidence { font: 17px Arial, Helvetica, sans-serif; fill: #a9bbce; }
      .footer { font: 20px Arial, Helvetica, sans-serif; fill: #b9c8da; }
    </style>
    <rect width="1600" height="900" fill="#081522"/>
    <rect x="60" y="61" width="85" height="8" rx="4" fill="#7eacff"/>
    <text x="60" y="112" class="eyebrow" fill="#7eacff">BUILD PROCESS / EVIDENCE MAP</text>
    <text x="60" y="170" class="title">CharacterBench: from fixed checks to an alpha UI</text>
    <text x="60" y="209" class="subtitle">A retrospective map of public code revisions</text>

    <rect x="60" y="225" width="460" height="520" rx="24" fill="#142436" stroke="#31445a" stroke-width="2"/>
    <circle cx="107" cy="274" r="18" fill="#7eacff"/>
    <text x="107" y="282" text-anchor="middle" class="number">1</text>
    <text x="94" y="330" class="date" fill="#7eacff">FIRST ALPHA · SEP 2026</text>
    <text x="94" y="363" class="cardtitle">Repeat the same test</text>
    <text x="94" y="394" class="body">Fixed conversations exposed false</text><text x="94" y="432" class="body">memories, invented lore, and</text><text x="94" y="470" class="body">relationship drift after changes.</text>
    <line x1="94" y1="654" x2="486" y2="654" stroke="#31445a"/>
    <text x="94" y="686" class="evidence">0.1.1-alpha · commit c0533108</text>

    <rect x="570" y="225" width="460" height="520" rx="24" fill="#142436" stroke="#31445a" stroke-width="2"/>
    <circle cx="617" cy="274" r="18" fill="#7eacff"/>
    <text x="617" y="282" text-anchor="middle" class="number">2</text>
    <text x="604" y="330" class="date" fill="#7eacff">DESIGN CHANGE · 15 SEP</text>
    <text x="604" y="363" class="cardtitle">Make comparison usable</text>
    <text x="604" y="394" class="body">Import a card, review starter</text><text x="604" y="432" class="body">checks, and save a baseline.</text><text x="604" y="470" class="body">Test fingerprints protect against</text><text x="604" y="508" class="body">unfair comparisons.</text>
    <line x1="604" y1="654" x2="996" y2="654" stroke="#31445a"/>
    <text x="604" y="686" class="evidence">commits a5ade05c · 672c1a57 · f327bbe2</text>

    <rect x="1080" y="225" width="460" height="520" rx="24" fill="#142436" stroke="#31445a" stroke-width="2"/>
    <circle cx="1127" cy="274" r="18" fill="#7eacff"/>
    <text x="1127" y="282" text-anchor="middle" class="number">3</text>
    <text x="1114" y="330" class="date" fill="#7eacff">REVIEW BUILD · 26 OCT</text>
    <text x="1114" y="363" class="cardtitle">Run and inspect locally</text>
    <text x="1114" y="394" class="body">A loopback proxy fix restored local</text><text x="1114" y="432" class="body">Ollama access. v0.2.2-alpha has</text><text x="1114" y="470" class="body">a local UI, instant fixture, and</text><text x="1114" y="508" class="body">diagnostic reports.</text>
    <line x1="1114" y1="654" x2="1506" y2="654" stroke="#31445a"/>
    <text x="1114" y="686" class="evidence">commit 7db6e2b9 · v0.2.2-alpha</text>

    <path d="M530 480 l27 0 m-10 -10 l10 10 -10 10 M1040 480 l27 0 m-10 -10 l10 10 -10 10"
          stroke="#7eacff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="60" y="820" class="footer">The instant demo uses synthetic saved responses; it does not establish real-model accuracy.</text>
    <text x="60" y="854" class="footer">Source files, tests, and limits: see docs/BUILD_PROCESS.md in the project repository.</text>
  </svg>